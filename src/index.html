<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h2>TaskFlow</h2>
      <p>Desktop Task Manager</p>

      <nav>
        <a href="#" class="active">Dashboard</a>
      </nav>
    </aside>

    <main class="main">
      <header>
        <h1>My Tasks</h1>
        <p>Organize your work and stay productive.</p>
      </header>

      <section class="stats">
        <div class="stat-card">
          <h3>Total Tasks</h3>
          <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
          <h3>Completed</h3>
          <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat-card">
          <h3>Pending</h3>
          <h2 id="pendingTasks">0</h2>
        </div>
      </section>

      <section class="task-section">
        <h2>Add New Task</h2>

        <form id="taskForm">
          <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
            required
          />

          <button type="submit">Add Task</button>
        </form>

        <h2>Task List</h2>

        <div id="taskList"></div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
